{# Shared "not implemented yet" block so every section states its status the same way. #}
{% macro deferred(title, items) %}
  <section class="panel panel-deferred">
    <h2>{{ title }}</h2>
    <ul class="checklist">
      {% for item in items %}
        <li>{{ item }}</li>
      {% endfor %}
    </ul>
    <p class="note">Not implemented yet. Nothing on this page is simulated.</p>
  </section>
{% endmacro %}
