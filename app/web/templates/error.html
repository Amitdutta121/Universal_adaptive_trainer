{% extends "base.html" %}

{% block heading %}Error {{ status_code }}{% endblock %}

{% block content %}
  <section class="panel">
    <p class="lede">{{ message }}</p>
    {% if detail %}
      <pre class="detail">{{ detail }}</pre>
      <p class="note">Details are shown because the app is running in development.</p>
    {% endif %}
    <p><a class="button" href="/">Back to the dashboard</a></p>
  </section>
{% endblock %}
