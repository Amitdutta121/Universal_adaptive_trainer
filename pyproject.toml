[project]
name = "adaptive-trainer"
version = "0.1.0"
description = "Adaptive Python training platform: professor content generation + student adaptive training."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # Backs pydantic's EmailStr, used to validate the student's contact email at
    # enrolment (app/web/routes/api/schemas.py). Already present transitively via
    # fastapi-users; named here because application code now depends on it.
    "email-validator>=2.0",
    "sqlalchemy>=2.0.36",
    # Schema migrations, applied in-process on start (app/persistence/database.py).
    # See docs/DECISIONS.md ADR-051.
    "alembic>=1.13",
    # Isolated capability graders (graders/, docs/GENERIC_ASSESSMENT_MILESTONES.md):
    # numeric answers with units, and symbolic (formula) equivalence.
    "pint>=0.24",
    "sympy>=1.13",
    # Cookie-session auth for the Instructor Studio (app/auth/). Database
    # strategy: logout revokes server-side rather than only clearing the cookie.
    "fastapi-users[sqlalchemy]>=14.0",
    # fastapi-users' SQLAlchemy adapter requires an async session; this is the
    # only place an async SQLite driver is needed (app/persistence/async_database.py).
    "aiosqlite>=0.20",
    # Structured LLM calls via Instructor over OpenRouter (app/llm/client.py).
    # See docs/DECISIONS.md ADR-020.
    "instructor>=1.15",
    "openai>=1.60",
    # Asynchronous judge batch jobs (app/llm/batch.py). Instructor cannot wrap a
    # job that is submitted now and collected later. See docs/DECISIONS.md ADR-030.
    "httpx>=0.27",
    # Reads a PDF's own outline and page text; confined to app/ingestion/pdf/.
    # AGPL-3.0/commercial licensed -- a deliberate tradeoff. See docs/DECISIONS.md
    # ADR-048.
    "pymupdf>=1.28",
    "pymupdf4llm>=1.28",
    # Hybrid chunk retrieval (app/retrieval/fusion.py, Task 11): QueryFusionRetriever + BM25
    # (bm25s, PyStemmer). MIT. Its stock setup beat our own BM25 + RRF, MRR@10 0.937 vs 0.888
    # (docs/RETRIEVAL_BASELINE.md). Imported lazily; no LLM or embedding call goes through it.
    "llama-index-core>=0.14.25,<0.15",
    "llama-index-retrievers-bm25>=0.8",
    # Fernet encryption of API keys saved in model settings (app/settings_store.py, Task 41).
    # Already installed transitively (paramiko); named because application code uses it.
    "cryptography>=42",
    # The question-style library is YAML, one file per style (styles/, app/styles/loader.py).
    # Already installed transitively; named because application code uses it.
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Layout-aware book chunking for PDF, DOCX and PPTX (app/ingestion/parsing.py; chosen in
# docs/PARSE_SPIKE.md: +0.08 MRR@10 over page chunks). Optional because it pulls CPU torch
# and ~500 MB of models; without it a PDF is chunked by page text. CPU torch:
#   uv pip install -e .[parse] --extra-index-url https://download.pytorch.org/whl/cpu
parse = [
    "docling>=2.0",
]
# Headless check of html tutorial blocks at generation time (app/tutorials/html_check.py,
# Task 23): console errors, network requests, and the stepper clicked through against its
# recorded trace. Needs its browser too: playwright install chromium. Without it html
# blocks are saved as failed, never shipped unchecked.
htmlcheck = [
    "playwright>=1.48",
]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[project.scripts]
adaptive-trainer = "app.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "graders*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not integration'"
filterwarnings = ["error::DeprecationWarning:app.*"]
markers = ["integration: hits a real LLM provider"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "data", "docs/superpowers"]
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
