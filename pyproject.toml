[project]
name = "adaptive-trainer"
version = "0.1.0"
description = "Adaptive Python training platform: professor content generation + student adaptive training."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    # Structured LLM calls via Instructor over OpenRouter (app/llm/client.py).
    # See docs/DECISIONS.md ADR-020.
    "instructor>=1.15",
    "openai>=1.60",
    # Asynchronous judge batch jobs (app/llm/batch.py). Instructor cannot wrap a
    # job that is submitted now and collected later. See docs/DECISIONS.md ADR-030.
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[project.scripts]
adaptive-trainer = "app.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["web/templates/*.html", "web/static/css/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not integration'"
filterwarnings = ["error::DeprecationWarning:app.*"]
markers = ["integration: hits a real LLM provider"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "data", "docs/superpowers"]
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
