# Production overrides for a single server. See docs/DEPLOYMENT.md.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Adds Caddy (HTTPS on 80/443 with automatic certificates) in front of the frontend and the
# Piston sandbox for running question and student code. Only Caddy is published; the backend,
# frontend and Piston are reachable on the internal network only. Reads DOMAIN and the
# production settings from .env.
services:
  backend:
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      PUBLIC_APP_URL: https://${DOMAIN:?set DOMAIN in .env}
      # The browser only talks to the frontend's origin, which proxies /api; no CORS needed.
      CORS_ALLOW_ORIGINS: ""
      EXECUTOR: piston
      PISTON_URL: http://piston:2000
    ports: !reset []
    depends_on:
      - piston

  frontend:
    restart: unless-stopped
    ports: !reset []

  caddy:
    image: caddy:2
    restart: unless-stopped
    command: caddy reverse-proxy --from ${DOMAIN:?set DOMAIN in .env} --to frontend:3000
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - frontend

  # Same image, limits and caveats as docker/piston/docker-compose.yml (read its README).
  piston:
    image: ghcr.io/engineer-man/piston@sha256:2f66b7456189c4d713aa986d98eccd0b6ee16d26c7ec5f21b30e942756fd127a
    restart: unless-stopped
    privileged: true
    volumes:
      - piston-packages:/piston/packages
    tmpfs:
      - /tmp:exec
    environment:
      PISTON_RUN_TIMEOUT: "30000"
      PISTON_RUN_CPU_TIME: "30000"
      PISTON_COMPILE_TIMEOUT: "10000"
      PISTON_RUN_MEMORY_LIMIT: "536870912"
      PISTON_MAX_PROCESS_COUNT: "64"
      PISTON_MAX_OPEN_FILES: "256"
      PISTON_MAX_FILE_SIZE: "10000000"
      PISTON_OUTPUT_MAX_SIZE: "65536"
      PISTON_MAX_CONCURRENT_JOBS: "16"
      PISTON_DISABLE_NETWORKING: "true"
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2g

volumes:
  caddy-data:
  caddy-config:
  piston-packages:
