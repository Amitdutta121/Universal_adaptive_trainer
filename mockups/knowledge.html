<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Knowledge map · Adaptive Trainer (mockup)</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/basecoat-css@1.0.2/dist/basecoat.cdn.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="assets/theme.css">
  <script src="https://cdn.jsdelivr.net/npm/basecoat-css@1.0.2/dist/js/all.min.js" defer></script>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js" defer></script>
  <style>
    .code { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 12.5px; line-height: 1.55; white-space: pre; overflow-x: auto; background: var(--muted); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; }
    .out { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 13px; white-space: pre; }
    .kind-dot { width: 10px; height: 10px; border-radius: 999px; display: inline-block; }
  </style>
</head>
<!-- Knowledge map: every subtopic tagged with the KIND of thing it teaches (fact, category, procedure,
     cause and effect, argument) and HOW answers are checked (run it, look it up, rubric). "Wrong rules"
     shows the core idea: the right rule gives the answer key, each misconception written as a rule gives
     one wrong option, and a student's wrong answer tells you which mistake they made. ?tab=kinds|units|rules -->
<body data-scope="course" data-nav="knowledge" data-title="Knowledge map">
  <main x-data="page()" x-cloak class="grid gap-6">
    <div class="flex flex-wrap items-end gap-3">
      <div class="max-w-3xl">
        <p class="text-sm text-muted-foreground" x-text="`${course.code} · ${course.name}`"></p>
        <h1 class="text-2xl font-semibold">Knowledge map</h1>
        <p class="text-sm text-muted-foreground mt-1">What this course teaches, sorted by the kind of thing it is and how answers get checked. Every subject is a mix of the same five kinds, so the same tools and checks work everywhere.</p>
      </div>
      <div class="ml-auto flex gap-1 rounded-lg p-1" style="background:var(--muted)">
        <template x-for="t in TABS" :key="t[0]">
          <button type="button" class="btn" data-size="sm" :data-variant="tab === t[0] ? null : 'ghost'" @click="tab = t[0]" x-text="t[1]"></button>
        </template>
      </div>
    </div>

    <!-- ===== 1. The five kinds ===== -->
    <template x-if="tab === 'kinds'">
      <div class="grid gap-4">
        <section class="card py-4">
          <section class="grid gap-2">
            <div class="flex flex-wrap items-baseline gap-x-3 text-sm"><span class="font-medium">This course</span><span class="text-muted-foreground" x-text="`${units.length} subtopics, by kind`"></span></div>
            <div class="flex h-3 overflow-hidden rounded-full">
              <template x-for="k in KIND_ORDER" :key="k">
                <div :style="{ width: `${count(k) / units.length * 100}%`, background: COLOR[k] }" :title="`${K[k].label}: ${count(k)}`"></div>
              </template>
            </div>
            <div class="flex flex-wrap gap-x-5 gap-y-1 text-xs">
              <template x-for="k in KIND_ORDER" :key="k">
                <button type="button" class="flex items-center gap-1.5 hover:underline" @click="tab = 'units'; kindFilter = k"><span class="kind-dot" :style="{ background: COLOR[k] }"></span><span x-text="`${K[k].label} ${count(k)}`"></span></button>
              </template>
            </div>
          </section>
        </section>

        <section class="card gap-0 py-0">
          <div class="table-container">
            <table class="table text-sm">
              <thead><tr><th class="pl-6 w-56">Kind</th><th>Intro to Python</th><th>Statistics</th><th>Biology</th><th class="w-56">Teach with</th><th class="pr-6 w-32">Checked by</th></tr></thead>
              <tbody>
                <template x-for="k in KIND_ORDER" :key="k">
                  <tr>
                    <td class="pl-6 align-top">
                      <div class="flex items-center gap-2 font-medium"><span class="kind-dot" :style="{ background: COLOR[k] }"></span><span x-text="K[k].label"></span></div>
                      <div class="text-xs text-muted-foreground" x-text="K[k].short"></div>
                      <div class="text-xs text-muted-foreground font-mono mt-1" x-text="K[k].ask"></div>
                    </td>
                    <template x-for="ex in EX[k]" :key="ex[0]">
                      <td class="align-top whitespace-normal"><div x-text="ex[2]"></div><div class="text-xs text-muted-foreground" x-text="ex[1]"></div></td>
                    </template>
                    <td class="align-top whitespace-normal"><div class="flex flex-wrap gap-1"><template x-for="t in K[k].teach" :key="t"><span class="pill tone-muted" x-text="t"></span></template></div></td>
                    <td class="pr-6 align-top"><span class="pill" :class="CH[k === 'argument' ? 'rubric' : k === 'fact' || k === 'category' ? 'lookup' : 'run'].tone" x-text="CH[k === 'argument' ? 'rubric' : k === 'fact' || k === 'category' ? 'lookup' : 'run'].label"></span>
                      <div class="text-xs text-muted-foreground mt-1" x-show="k === 'fact' || k === 'category'">or run it, when code can show it</div></td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
          <footer class="border-t px-6 py-3 text-xs text-muted-foreground" style="border-color:var(--border)">The kind decides the teaching tools; the checker decides how far an answer can be trusted. Adding a subject means having its checkers, not building a new product.</footer>
        </section>
      </div>
    </template>

    <!-- ===== 2. This course's units ===== -->
    <template x-if="tab === 'units'">
      <section class="card gap-0 py-0">
        <header class="flex flex-wrap items-center gap-3 px-6 pt-5 pb-4">
          <h2 class="font-semibold">Subtopics by kind</h2>
          <span class="text-sm text-muted-foreground" x-text="`${shownUnits.length} shown · ${units.filter((u) => u.wrong_rules).length} with wrong rules written`"></span>
          <div class="ml-auto flex flex-wrap gap-1 rounded-lg p-1" style="background:var(--muted)">
            <button type="button" class="btn" data-size="sm" :data-variant="kindFilter === 'all' ? null : 'ghost'" @click="kindFilter = 'all'">All</button>
            <template x-for="k in KIND_ORDER" :key="k">
              <button type="button" class="btn" data-size="sm" :data-variant="kindFilter === k ? null : 'ghost'" @click="kindFilter = k" x-text="K[k].label"></button>
            </template>
          </div>
        </header>
        <div class="table-container border-t">
          <table class="table text-sm">
            <thead><tr><th class="pl-6">Subtopic</th><th class="w-44">Kind</th><th>Teach with</th><th>Checked by</th><th>Wrong rules</th><th>Questions</th><th class="pr-6"></th></tr></thead>
            <tbody>
              <template x-for="u in shownUnits" :key="u.sub_id">
                <tr>
                  <td class="pl-6"><div class="font-medium" x-text="u.sub"></div><div class="text-xs text-muted-foreground" x-text="u.topic"></div></td>
                  <td>
                    <select class="select w-40" :aria-label="`Kind of ${u.sub}`" x-model="u.kind" @change="u.checker = u.kind === 'argument' ? 'rubric' : 'run'; Mock.toast(`${u.sub} is now a ${K[u.kind].label.toLowerCase()}. Its lesson and questions switch to the matching tools.`)">
                      <template x-for="k in KIND_ORDER" :key="k"><option :value="k" x-text="K[k].label" :selected="u.kind === k"></option></template>
                    </select>
                  </td>
                  <td class="text-xs text-muted-foreground" x-text="K[u.kind].teach.slice(0, 2).join(', ')"></td>
                  <td><span class="pill" :class="CH[u.checker].tone" x-text="CH[u.checker].label"></span></td>
                  <td class="text-xs" :style="!u.wrong_rules ? { color: 'var(--muted-foreground)' } : {}" x-text="u.wrong_rules ? `${u.wrong_rules} written` : 'none yet'"></td>
                  <td class="text-xs" x-text="u.questions"></td>
                  <td class="pr-6 text-right"><button type="button" class="btn" data-size="sm" data-variant="outline" x-show="u.lab" @click="openLab(u.lab)">See wrong rules</button></td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </section>
    </template>

    <!-- ===== 3. Wrong rules ===== -->
    <template x-if="tab === 'rules'">
      <div class="grid gap-4">
        <section class="card py-4">
          <section class="grid gap-3">
            <p class="text-sm">Write each common mistake down as a <b>wrong rule</b>. Run the right rule: that's the answer key. Run each wrong rule: each gives one wrong option. When a student picks a wrong option, you know which mistake they made.</p>
            <div class="flex flex-wrap gap-1.5">
              <template x-for="r in RULES" :key="r.id">
                <button type="button" class="btn" data-size="sm" :data-variant="lab === r.id ? null : 'outline'" @click="openLab(r.id)">
                  <span x-text="r.sub"></span><span class="text-xs opacity-70" x-text="`· ${COURSE_NAME[r.course]}`"></span>
                </button>
              </template>
            </div>
          </section>
        </section>

        <template x-if="cur">
          <div class="grid lg:grid-cols-[minmax(0,1.15fr)_minmax(0,1fr)] gap-4 items-start">
            <section class="card gap-4">
              <header>
                <div class="flex flex-wrap items-center gap-2 text-xs">
                  <span class="pill tone-muted" x-text="COURSE_NAME[cur.course]"></span>
                  <span class="flex items-center gap-1.5"><span class="kind-dot" :style="{ background: COLOR[cur.kind] }"></span><span x-text="K[cur.kind].label"></span></span>
                  <span class="pill" :class="CH[cur.checker].tone" x-text="CH[cur.checker].label"></span>
                </div>
                <h2 class="mt-2" x-text="cur.question.split('\n\n')[0].replace(/`/g, '')"></h2>
                <div class="code mt-2" x-show="cur.question.includes('\n\n')" x-text="cur.question.split('\n\n').slice(1).join('\n\n')"></div>
              </header>
              <section class="grid gap-3">
                <div class="rounded-lg border p-3" style="border-color:var(--ok-solid)">
                  <div class="flex items-center gap-2 text-sm"><span class="pill tone-ok">Right rule</span><span x-text="cur.right.rule"></span></div>
                  <div class="code mt-2" x-show="cur.right.code" x-text="cur.right.code"></div>
                  <blockquote class="mt-2 text-sm border-l-2 pl-3" style="border-color:var(--primary)" x-show="cur.right.quote"><span x-text="`“${cur.right.quote}”`"></span><div class="text-xs text-muted-foreground mt-1" x-text="cur.right.section"></div></blockquote>
                  <div class="mt-2 flex items-center gap-2 text-sm"><span class="text-muted-foreground" x-text="cur.right.code ? 'Prints' : 'Answer'"></span><span class="out font-medium" x-text="cur.right.output"></span><span class="ml-auto text-xs" style="color:var(--ok-solid)">→ answer key</span></div>
                </div>
                <template x-for="(w, i) in cur.wrong" :key="i">
                  <div class="rounded-lg border p-3" :style="picked === w.output ? { borderColor: 'var(--critical-solid)', background: 'color-mix(in oklch, var(--critical-solid) 6%, transparent)' } : {}">
                    <div class="flex items-center gap-2 text-sm"><span class="pill tone-warn" x-text="`Wrong rule ${i + 1}`"></span><span x-text="w.rule"></span></div>
                    <div class="code mt-2" x-show="w.code" x-text="w.code"></div>
                    <div class="mt-2 flex items-center gap-2 text-sm"><span class="text-muted-foreground" x-text="w.code ? 'Prints' : 'Answer'"></span><span class="out" x-text="w.output"></span><span class="ml-auto text-xs text-muted-foreground">→ a wrong option</span></div>
                  </div>
                </template>
                <div class="flex flex-wrap gap-x-5 gap-y-1 text-xs">
                  <span class="flex items-center gap-1.5"><span class="pill" :class="cur.checks.right_unique ? 'tone-ok' : 'tone-critical'" x-text="cur.checks.right_unique ? '✓' : '✗'"></span>No wrong rule gives the right answer</span>
                  <span class="flex items-center gap-1.5"><span class="pill" :class="cur.checks.wrong_distinct ? 'tone-ok' : 'tone-critical'" x-text="cur.checks.wrong_distinct ? '✓' : '✗'"></span>Every wrong option is a different mistake</span>
                  <span class="text-muted-foreground" x-text="cur.checker === 'run' ? 'Outputs computed by running each rule.' : 'Answer from a book quote; wrong rules written as text.'"></span>
                </div>
              </section>
            </section>

            <section class="card gap-3">
              <header><h2>What the student sees</h2><p>Pick an answer to see what it tells you about the student.</p></header>
              <section class="grid gap-2">
                <template x-for="(o, i) in options" :key="o">
                  <button type="button" class="flex items-center gap-3 rounded-lg border px-3 py-2 text-left text-sm hover:bg-[var(--accent)]" :style="picked === o ? { borderColor: o === cur.right.output ? 'var(--ok-solid)' : 'var(--critical-solid)' } : {}" @click="picked = o">
                    <span class="font-mono text-xs text-muted-foreground" x-text="String.fromCharCode(65 + i)"></span><span class="out" x-text="o"></span>
                  </button>
                </template>
              </section>
              <template x-if="picked !== null">
                <div class="rounded-lg p-3 text-sm" :style="{ background: picked === cur.right.output ? 'color-mix(in oklch, var(--ok-solid) 10%, transparent)' : 'color-mix(in oklch, var(--critical-solid) 8%, transparent)' }">
                  <template x-if="picked === cur.right.output"><div><b>Correct.</b> Mastery of <span x-text="cur.sub"></span> goes up.</div></template>
                  <template x-if="picked !== cur.right.output && diagnosis">
                    <div class="grid gap-1.5">
                      <div><b>Mistake found:</b> <span x-text="diagnosis.rule"></span></div>
                      <div x-text="diagnosis.feedback"></div>
                      <div class="text-xs text-muted-foreground">This feedback is shown to the student, the mistake is counted on Insights, and their next question targets it.</div>
                    </div>
                  </template>
                </div>
              </template>
              <footer class="border-t pt-3 text-xs text-muted-foreground" style="border-color:var(--border)" x-text="`${cur.wrong.length} wrong rules → ${cur.wrong.length} wrong options. A question with no wrong rules can still be marked, but can't say which mistake a student made.`"></footer>
            </section>
          </div>
        </template>
      </div>
    </template>
  </main>

  <script src="assets/mock-data.js"></script>
  <script src="assets/data-g.js"></script>
  <script src="assets/data-gen.js"></script>
  <script src="assets/data-lessons-content.js"></script>
  <script src="assets/data-lessons.js"></script>
  <script src="assets/data-knowledge-rules.js"></script>
  <script src="assets/data-knowledge.js"></script>
  <script src="assets/data-multi.js"></script>
  <script src="assets/data-tools.js"></script>
  <script src="assets/layout.js"></script>
  <script>
    function page() {
      const c = Mock.course;
      const RULES = MOCK.wrong_rules;
      const lab0 = Mock.param("rule") || "aliasing";
      return {
        course: c, K: MOCK.KINDS, CH: MOCK.CHECKERS, EX: MOCK.KIND_EXAMPLES, RULES,
        KIND_ORDER: ["fact", "category", "procedure", "model", "argument"],
        COLOR: { fact: "var(--muted-foreground)", category: "var(--accent-foreground)", procedure: "var(--primary)", model: "var(--warn-solid)", argument: "var(--critical-solid)" },
        COURSE_NAME: { python: "Intro to Python", statistics: "Statistics", biology: "Biology" },
        TABS: [["kinds", "The five kinds"], ["units", "This course"], ["rules", "Wrong rules"]],
        tab: Mock.param("tab") || "kinds", kindFilter: "all", lab: lab0, picked: null,
        // TODO(real): units exist per course; the mock tags Intro to Python.
        units: MOCK.knowledgeUnits.map((u) => ({ ...u })),
        count(k) { return this.units.filter((u) => u.kind === k).length; },
        get shownUnits() { return this.units.filter((u) => this.kindFilter === "all" || u.kind === this.kindFilter); },
        get cur() { return RULES.find((r) => r.id === this.lab) || null; },
        get options() {
          if (!this.cur) return [];
          // Fixed, mixed order: the key isn't always first.
          const all = [this.cur.right.output, ...this.cur.wrong.map((w) => w.output)];
          return all.map((o, i) => [o, (i * 7 + this.cur.id.length) % 11]).sort((a, b) => a[1] - b[1]).map((x) => x[0]);
        },
        get diagnosis() { return this.cur?.wrong.find((w) => w.output === this.picked) || null; },
        openLab(id) { this.lab = id; this.picked = null; this.tab = "rules"; },
      };
    }
  </script>
</body>
</html>
