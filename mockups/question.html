<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Question · Adaptive Trainer (mockup)</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/basecoat-css@1.0.2/dist/basecoat.cdn.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="assets/theme.css">
  <script src="https://cdn.jsdelivr.net/npm/basecoat-css@1.0.2/dist/js/all.min.js" defer></script>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js" defer></script>
  <style>
    /* Question surface (QView in assets/data-c9-c13.js); same block in review.html. */
    .qv-text { white-space: pre-wrap; line-height: 1.6; }
    .qv-code { font-family: var(--font-mono); font-size: 0.85em; background: var(--muted); border-radius: 0.3rem; padding: 0.05rem 0.3rem; }
    .qv-pre { font-family: var(--font-mono); font-size: 0.8rem; line-height: 1.6; background: var(--muted); border-radius: 0.5rem; padding: 0.75rem 0.9rem; margin-top: 0.75rem; overflow-x: auto; white-space: pre; }
    .qv-blank { background: var(--warn-wash); color: var(--warn-solid); border-radius: 0.2rem; }
    .qv-label { margin-top: 0.75rem; font-size: 0.72rem; color: var(--muted-foreground); }
    .qv-options { display: grid; gap: 0.5rem; margin-top: 0.9rem; }
    .qv-options li, .qv-blocks li { display: flex; align-items: center; gap: 0.6rem; border: 1px solid var(--border); border-radius: 0.6rem; padding: 0.55rem 0.75rem; font-size: 0.9rem; background: var(--card); }
    .qv-letter { display: inline-grid; place-items: center; width: 1.5rem; height: 1.5rem; border-radius: 999px; font-size: 0.72rem; font-weight: 600; background: var(--muted); color: var(--muted-foreground); flex-shrink: 0; }
    .qv-letter.qv-ok { background: var(--ok-wash); color: var(--ok-solid); }
    .qv-blocks { display: grid; gap: 0.35rem; margin-top: 0.4rem; }
    .qv-blocks li { font-family: var(--font-mono); font-size: 0.8rem; padding: 0.4rem 0.6rem; }
    .qv-blocks svg { width: 0.9rem; height: 0.9rem; color: var(--muted-foreground); }
    .qv-input { margin-top: 0.75rem; border: 1px dashed var(--border); border-radius: 0.5rem; padding: 0.55rem 0.75rem; font-size: 0.8rem; color: var(--muted-foreground); }
    .qv-editor { font-family: var(--font-mono); }
    .qv-label:first-child, .qv-pre:first-child { margin-top: 0; }
  </style>
</head>
<!-- C11 · Question detail: the student-facing surface, checks, judges, duplicates, history, decision. -->
<body data-scope="course" data-nav="questions" data-title="Question">
  <main x-data="page()" x-cloak class="grid gap-6">
    <nav class="text-sm text-muted-foreground flex items-center gap-1">
      <a class="hover:underline" :href="Mock.link('questions.html')">Question bank</a>
      <i data-lucide="chevron-right" class="size-3.5"></i>
      <span x-text="q ? `#${q.id}` : 'Not found'"></span>
    </nav>

    <template x-if="!q">
      <div class="card">
        <section class="grid place-items-center gap-3 py-12 text-center">
          <div class="font-medium" x-text="course.numbers.questions ? `Question ${id} is not in this course` : 'This course has no questions yet'"></div>
          <p class="text-sm text-muted-foreground max-w-md" x-text="course.numbers.questions ? 'It may belong to another course, or the link is out of date.' : 'Generation is blocked until the course taxonomy is approved.'"></p>
          <a class="btn" data-variant="outline" :href="Mock.link('questions.html')">Back to the question bank</a>
        </section>
      </div>
    </template>

    <template x-if="q">
      <div class="grid gap-6">
        <!-- Header -->
        <div class="flex flex-wrap items-start gap-3">
          <div class="min-w-0">
            <h1 class="text-2xl font-semibold" x-text="`Question ${q.id}`"></h1>
            <p class="text-sm text-muted-foreground" x-text="`${q.topic} · ${q.subtopic} · ${MOCK.question_types[q.type].label} · ${q.difficulty}`"></p>
            <div class="mt-2 flex flex-wrap gap-1.5">
              <span class="pill" :class="Mock.tone(status)" x-text="Mock.label(status)"></span>
              <span class="pill" :class="kc.failed ? 'tone-critical' : kc.tone" :title="`Answer key checked by ${kc.cb.name} ${kc.cb.version}: ${kc.failed ? 'check failed' : kc.cb.level}`" x-text="kc.failed ? `${kc.cb.name}: check failed` : kc.cb.name"></span>
              <span class="pill" :class="flagCount ? 'tone-warn' : 'tone-ok'" x-text="flagCount ? `judges: ${flagCount} of 4 flagged` : 'judges: all pass'"></span>
              <span class="pill tone-warn" x-show="dupes.length"><i data-lucide="copy" class="size-3"></i>Possible duplicate</span>
              <span class="pill tone-accent" x-show="edited">Edited</span>
              <template x-if="exam"><a class="pill tone-warn hover:underline" :href="Mock.link('exam-export.html')" :title="`Exported ${fmt(exam.exported)} for ${exam.name} (${fmt(exam.date)}). Not served in practice or assignments until ${fmt(exam.held_until)}.`"><i data-lucide="lock" class="size-3"></i><span x-text="`Held for ${exam.name} until ${fmt(exam.held_until)}`"></span></a></template>
            </div>
          </div>
          <div class="ml-auto flex flex-wrap gap-2" x-show="mode === 'view'">
            <button type="button" class="btn" data-variant="outline" @click="startEdit()"><i data-lucide="pencil"></i>Edit</button>
            <button type="button" class="btn" data-variant="outline" @click="startReject()" x-show="status !== 'rejected'"><i data-lucide="x"></i>Reject</button>
            <button type="button" class="btn" @click="approve()" x-show="status !== 'approved'" :disabled="status === 'validation_failed'" :title="status === 'validation_failed' ? 'Failed deterministic checks; edit it first' : ''"><i data-lucide="check"></i>Approve</button>
          </div>
        </div>

        <div class="grid gap-6 lg:grid-cols-[minmax(0,1fr)_22rem]">
          <div class="grid gap-6 content-start min-w-0">
            <!-- Student surface -->
            <div class="card">
              <header>
                <h2>What the student sees</h2>
                <p x-text="mode === 'edit' ? 'Editing. Saving approves the edited version; the original is kept in history.' : 'Rendered as in the practice app.'"></p>
              </header>
              <section x-show="mode !== 'edit'"><div x-html="QView.student(q, prompt)"></div></section>
              <section x-show="mode === 'edit'" class="grid gap-3">
                <div role="group" class="field">
                  <label for="e-prompt">Prompt</label>
                  <textarea id="e-prompt" class="textarea font-mono text-sm" rows="6" x-model="draft.prompt"></textarea>
                </div>
                <div role="group" class="field" x-show="q.answer_text">
                  <label for="e-answer">Answer / expected output</label>
                  <textarea id="e-answer" class="textarea font-mono text-sm" rows="2" x-model="draft.answer_text"></textarea>
                </div>
                <div class="flex gap-2">
                  <button type="button" class="btn" @click="saveEdit()" :disabled="!draftChanged">Save and approve</button>
                  <button type="button" class="btn" data-variant="ghost" @click="mode = 'view'">Cancel</button>
                  <span class="text-xs text-muted-foreground self-center" x-show="!draftChanged">Nothing changed yet.</span>
                </div>
              </section>
            </div>

            <!-- Reject -->
            <div class="card" x-show="mode === 'reject'" style="border-color:var(--critical-solid)">
              <header>
                <h2>Why are you rejecting?</h2>
                <p>At least one reason is required. Reasons you give repeatedly become rules for the generator.</p>
              </header>
              <section class="grid gap-4">
                <div class="grid gap-2 sm:grid-cols-2">
                  <template x-for="r in reasons" :key="r[0]">
                    <label class="flex items-center gap-2 text-sm">
                      <input type="checkbox" class="input" :value="r[0]" x-model="rej.reasons"><span x-text="r[1]"></span>
                    </label>
                  </template>
                </div>
                <div role="group" class="field">
                  <label for="rej-note">Note <span class="text-muted-foreground font-normal">(optional)</span></label>
                  <textarea id="rej-note" class="textarea" rows="2" placeholder="Say what is wrong or what should be better." x-model="rej.note"></textarea>
                </div>
                <div class="flex gap-2 items-center">
                  <button type="button" class="btn" data-variant="destructive" :disabled="!rej.reasons.length" @click="reject()">Reject</button>
                  <button type="button" class="btn" data-variant="ghost" @click="mode = 'view'">Cancel</button>
                  <span class="text-xs text-muted-foreground" x-show="!rej.reasons.length">Choose at least one reason.</span>
                </div>
              </section>
            </div>

            <!-- Answer + source -->
            <div class="card">
              <header><h2>Answer</h2></header>
              <section class="grid gap-4">
                <div x-html="QView.answer(Object.assign({}, q, { answer_text: answerText }))"></div>
                <template x-if="kc.wrong.length">
                  <div class="grid gap-1.5 border-t pt-3">
                    <div class="text-xs text-muted-foreground" x-text="kc.tagged ? 'Mistakes behind the wrong options (tagged after writing)' : 'Mistakes behind the wrong options (not tagged yet)'"></div>
                    <template x-for="w in kc.wrong" :key="w.letter">
                      <div class="grid grid-cols-[1.5rem_minmax(0,16rem)_minmax(0,1fr)] items-center gap-2 text-sm">
                        <span class="qv-letter" x-text="w.letter"></span>
                        <span class="truncate" x-text="w.text" :title="w.text"></span>
                        <span class="text-xs text-muted-foreground" x-text="w.why || '—'"></span>
                      </div>
                    </template>
                  </div>
                </template>
                <div class="text-sm flex flex-wrap items-center gap-2 border-t pt-3">
                  <span class="text-muted-foreground">Source</span>
                  <a class="inline-flex items-center gap-1 hover:underline" :href="sourceHref"><i data-lucide="book-open" class="size-3.5"></i><span x-text="`${q.source.book} · ${q.source.section}`"></span></a>
                </div>
              </section>
            </div>

            <!-- Deterministic checks -->
            <div class="card">
              <header>
                <h2>Deterministic checks</h2>
                <p>These decide whether the question reaches the review queue at all.</p>
              </header>
              <section class="p-0">
                <div class="table-container">
                  <table class="table">
                    <thead><tr><th>Check</th><th>Detail</th><th class="w-24">Result</th></tr></thead>
                    <tbody>
                      <template x-for="c in checks" :key="c.name">
                        <tr>
                          <td class="font-mono text-xs" x-text="c.name"></td>
                          <td class="text-xs text-muted-foreground whitespace-normal" x-text="c.detail"></td>
                          <td><span class="pill" :class="c.result === 'n/a' ? 'tone-muted' : Mock.tone(c.result)" x-text="c.result === 'pass' ? 'passed' : c.result === 'fail' ? 'failed' : 'n/a'"></span></td>
                        </tr>
                      </template>
                    </tbody>
                  </table>
                </div>
              </section>
            </div>

            <!-- Judges -->
            <div class="card">
              <header>
                <h2>Advisory judges</h2>
                <p>Four judges, each compared with what the generator claimed. Advisory only; your review is the decision. <a class="underline" :href="Mock.link('alignment.html')">How often they agree with you</a></p>
              </header>
              <section class="p-0">
                <div class="table-container">
                  <table class="table">
                    <thead><tr><th>Judge</th><th class="w-24">Result</th><th>Note</th><th>Issue codes</th></tr></thead>
                    <tbody>
                      <template x-for="j in judges" :key="j.id">
                        <tr>
                          <td class="text-sm whitespace-nowrap" x-text="j.label"></td>
                          <td><span class="pill" :class="Mock.tone(j.verdict)" x-text="j.verdict === 'flag' ? 'flag' : 'pass'"></span></td>
                          <td class="text-xs text-muted-foreground whitespace-normal" x-text="j.note"></td>
                          <td class="text-xs whitespace-nowrap">
                            <template x-for="code in j.codes" :key="code"><span class="pill tone-muted font-mono" x-text="code"></span></template>
                            <span class="text-muted-foreground" x-show="!j.codes.length">–</span>
                          </td>
                        </tr>
                      </template>
                    </tbody>
                  </table>
                </div>
              </section>
            </div>
          </div>

          <!-- Right rail -->
          <div class="grid gap-6 content-start">
            <!-- Answer-key evidence (MOCK.verification via keyCheck) -->
            <div class="card">
              <header>
                <h2>How the answer key was checked</h2>
              </header>
              <section class="grid gap-3 text-sm">
                <div class="grid gap-1.5">
                  <div class="flex flex-wrap items-center gap-x-2 gap-y-1">
                    <span class="text-muted-foreground">Checked by</span>
                    <a class="font-medium hover:underline" :href="Mock.link('checking-tools.html')" x-text="kc.cb.name"></a>
                    <span class="font-mono text-xs" x-text="kc.cb.version"></span>
                    <span class="pill ml-auto" :class="kc.failed ? 'tone-critical' : kc.tone" x-text="kc.failed ? 'Check failed' : kc.cb.level"></span>
                  </div>
                  <p class="text-xs text-muted-foreground" x-text="kc.meaning"></p>
                </div>
                <template x-if="kc.failed">
                  <div class="grid gap-1.5">
                    <p class="flex items-start gap-2" style="color:var(--critical-solid)"><i data-lucide="circle-x" class="size-4 mt-0.5 shrink-0"></i><span x-text="kc.v.note"></span></p>
                    <p class="text-xs text-muted-foreground">Fix the key or the question with Edit; the solution program runs again when you save.</p>
                  </div>
                </template>

                <template x-if="!kc.failed && kc.v.level === 'proven'">
                  <div class="grid gap-3">
                    <template x-if="kc.program"><div><div class="qv-label" x-text="kc.programLabel"></div><pre class="qv-pre" x-text="kc.program"></pre></div></template>
                    <template x-if="!kc.program"><p class="text-muted-foreground" x-text="kc.summary"></p></template>
                    <div class="grid gap-1.5 text-xs">
                      <template x-if="kc.output != null || kc.result">
                        <div class="grid grid-cols-[4rem_1fr] gap-x-2 gap-y-1.5 items-baseline">
                          <span class="text-muted-foreground" x-text="kc.output != null ? 'Output' : 'Result'"></span><code class="font-mono break-words" x-text="kc.output ?? kc.result"></code>
                          <span class="text-muted-foreground">Key</span><code class="font-mono break-words" x-text="kc.key"></code>
                          <span></span><span><span class="pill tone-ok"><i data-lucide="check" class="size-3"></i>matches</span></span>
                        </div>
                      </template>
                      <template x-if="kc.tests">
                        <div class="grid grid-cols-[4rem_1fr] gap-x-2 items-baseline">
                          <span class="text-muted-foreground">Tests</span><span x-text="`${kc.tests} of ${kc.tests} passed in the sandbox`"></span>
                        </div>
                      </template>
                    </div>
                  </div>
                </template>

                <template x-if="!kc.failed && kc.v.quotes">
                  <div class="grid gap-3">
                    <template x-for="(qt, i) in kc.v.quotes" :key="i">
                      <figure class="grid gap-1.5">
                        <blockquote class="border-l-2 pl-3" x-text="`“${qt.text}”`"></blockquote>
                        <figcaption class="flex flex-wrap items-center gap-1.5 text-xs text-muted-foreground">
                          <a class="hover:underline" :href="sourceHref" x-text="qt.section"></a>
                          <span class="pill" :class="qt.found ? 'tone-ok' : 'tone-critical'" x-text="qt.found ? 'found word for word' : 'not found in the section'"></span>
                        </figcaption>
                      </figure>
                    </template>
                    <p class="flex items-start gap-2 border-t pt-3">
                      <span class="pill shrink-0 font-mono" :class="kc.v.solvers.agree === kc.v.solvers.total ? 'tone-ok' : 'tone-warn'" x-text="`${kc.v.solvers.agree}/${kc.v.solvers.total}`"></span>
                      <span x-text="`${kc.v.solvers.agree} of ${kc.v.solvers.total} blind solvers chose the same answer as the key (${kc.v.solvers.models}). None of them saw the key.`"></span>
                    </p>
                    <p class="flex items-start gap-2 text-xs" style="color:var(--warn-solid)" x-show="kc.v.note"><i data-lucide="triangle-alert" class="size-3.5 mt-0.5 shrink-0"></i><span x-text="kc.v.note"></span></p>
                  </div>
                </template>
                <p class="text-xs text-muted-foreground" x-show="edited" x-text="`Checked again after your edit by ${kc.cb.name} ${kc.cb.version}; the label did not change.`"></p>
                <p class="flex items-center gap-1.5 border-t pt-3 text-xs text-muted-foreground"><i data-lucide="pin" class="size-3.5 shrink-0"></i><span x-text="`Pinned: re-checks use ${kc.cb.name} ${kc.cb.version}, even after the tool is updated.`"></span></p>
              </section>
            </div>

            <div class="card">
              <header><h2>Details</h2></header>
              <section>
                <dl class="grid grid-cols-[auto_1fr] gap-x-4 gap-y-2 text-sm">
                  <dt class="text-muted-foreground">Status</dt><dd x-text="Mock.label(status)"></dd>
                  <dt class="text-muted-foreground">Type</dt><dd x-text="MOCK.question_types[q.type].label"></dd>
                  <dt class="text-muted-foreground">Kind</dt><dd class="font-mono text-xs self-center" x-text="MOCK.question_types[q.type].code ? 'testable_program' : 'discrete'"></dd>
                  <dt class="text-muted-foreground">Difficulty</dt><dd x-text="q.difficulty"></dd>
                  <dt class="text-muted-foreground">Taxonomy</dt><dd x-text="activeVersion"></dd>
                  <dt class="text-muted-foreground">Generator</dt><dd class="font-mono text-xs self-center" x-text="q.generator"></dd>
                  <dt class="text-muted-foreground">Created</dt><dd class="font-mono text-xs self-center" x-text="q.created"></dd>
                  <template x-if="exam"><dt class="text-muted-foreground">Exam</dt></template>
                  <template x-if="exam"><dd><a class="hover:underline" :href="Mock.link('exam-export.html')" x-text="`${exam.name} (${fmt(exam.date)}), held out of practice until ${fmt(exam.held_until)}`"></a></dd></template>
                  <template x-if="rejectedWith">
                    <dt class="text-muted-foreground">Reason</dt>
                  </template>
                  <template x-if="rejectedWith"><dd x-text="rejectedWith"></dd></template>
                </dl>
              </section>
            </div>

            <div class="card">
              <header>
                <h2>Possible duplicates</h2>
                <p>Questions in the bank with a similar prompt (similarity ≥ 0.88).</p>
              </header>
              <section class="grid gap-3">
                <template x-for="d in dupes" :key="d.q.id">
                  <a class="grid gap-1 rounded-lg border p-3 hover:bg-muted" :href="Mock.link('question.html', { id: d.q.id })">
                    <div class="flex items-center gap-2 text-xs">
                      <span class="font-mono" x-text="`#${d.q.id}`"></span>
                      <span class="pill" :class="Mock.tone(d.q.status)" x-text="Mock.label(d.q.status)"></span>
                      <span class="ml-auto font-mono text-muted-foreground" x-text="`similarity ${d.score}`"></span>
                    </div>
                    <div class="text-sm line-clamp-2" x-text="d.q.prompt.split('\n')[0].replaceAll('`', '')"></div>
                  </a>
                </template>
                <p class="text-sm text-muted-foreground" x-show="!dupes.length">None found.</p>
              </section>
            </div>

            <div class="card">
              <header><h2>History</h2></header>
              <section>
                <ol class="grid gap-3">
                  <template x-for="(h, i) in history" :key="i">
                    <li class="grid grid-cols-[auto_1fr] gap-x-3 text-sm">
                      <span class="mt-1.5 size-2 rounded-full" :style="`background:${h.who === 'Maya Chen' ? 'var(--primary)' : 'var(--border)'}`"></span>
                      <div>
                        <div x-text="h.what"></div>
                        <div class="text-xs text-muted-foreground" x-text="`${h.who} · ${h.at}`"></div>
                      </div>
                    </li>
                  </template>
                </ol>
              </section>
            </div>
          </div>
        </div>
      </div>
    </template>
  </main>

  <script src="assets/mock-data.js"></script>
  <script src="assets/data-g.js"></script>
  <script src="assets/data-gen.js"></script>
  <script src="assets/data-c9-c13.js"></script>
  <script src="assets/data-lessons-content.js"></script>
  <script src="assets/data-lessons.js"></script>
  <script src="assets/data-multi.js"></script>
  <script src="assets/data-tools.js"></script>
  <script src="assets/layout.js"></script>
  <script>
    // Answer-key evidence for one question, from MOCK.verification(q). Same helper in question.html and review.html.
    // TODO(real): MOCK.verification stores the question stem as the "program" for choice and coding
    // questions; keyCheck rebuilds a plausible solution program from the stem for display only.
    function keyCheck(q) {
      const v = MOCK.verification(q);
      if (!v) return null;
      const L = MOCK.LEVELS[v.level];
      const LET = "ABCDEFGH";
      const key = q.type === "multiple_choice" ? `${LET[q.answer]} · ${q.options[q.answer]}`
        : q.type === "true_false" ? (q.answer ? "True" : "False") : q.answer_text;
      // TODO(real): reference solutions for the coding template (stored with the question in the real app).
      const REF = {
        count_words: "def count_words(text):\n    counts = {}\n    for w in text.split():\n        counts[w] = counts.get(w, 0) + 1\n    return counts",
        letter_counts: "def letter_counts(word):\n    counts = {}\n    for ch in word:\n        counts[ch] = counts.get(ch, 0) + 1\n    return counts",
        most_common: "def most_common(words):\n    return max(set(words), key=words.count)",
        invert: "def invert(d):\n    return {v: k for k, v in d.items()}",
        histogram: "def histogram(nums):\n    counts = {}\n    for n in nums:\n        counts[n] = counts.get(n, 0) + 1\n    return counts",
      };
      const choiceProgram = () => {
        const [stem, code] = [q.prompt.split("\n\n")[0], q.prompt.split("\n\n").slice(1).join("\n\n")];
        if (/\bwhich (expression|condition)/i.test(stem)) {
          const setup = stem.match(/^For (\w+ = [^,]+),/);
          return `${setup ? setup[1] + "\n" : ""}for expr in [${q.options.map((o) => JSON.stringify(o)).join(", ")}]:\n    print(expr, eval(expr))`;
        }
        if (/^Which (line|statement|call)/.test(stem)) return null;
        const frags = [...stem.matchAll(/`([^`]+)`/g)].map((m) => m[1]);
        if (frags.some((f) => /:$|^return\b|^with\b/.test(f))) return null;
        const lines = [];
        const setup = stem.match(/when (\w+ = [^?]+)\?/);
        if (setup) lines.push(setup[1]);
        if (code) lines.push(code);
        frags.forEach((f) => lines.push(/=(?!=)|^print\(/.test(f.replace(/[=!<>]=/g, "")) ? f : `print(${f})`));
        const shown = stem.match(/What does (print\(\w+\)) show/);
        if (shown) lines.push(shown[1]);
        return lines.length ? lines.join("\n") : null;
      };
      const out = { v, L, key, failed: !!v.failed, program: null, programLabel: "Solution program", output: null, tests: null };
      if (v.level === "proven") {
        const t = q.type;
        if (q.solution_program) { out.program = q.solution_program; out.result = v.output; out.picks = q.type === "multiple_choice" ? LET[q.answer] : (q.answer ? "True" : "False"); }
        else if (t === "output_prediction") { out.program = v.program; out.output = v.output; }
        else if (t === "code_completion") { out.program = v.program.replace("____", q.answer_text); out.programLabel = "Program with the keyed answer filled in"; }
        else if (t === "debugging") {
          const fix = (q.answer_text || "").match(/Add `(.+)` inside the loop/);
          out.program = fix ? `${v.program}\n    ${fix[1]}` : v.program; out.programLabel = fix ? "Program with the keyed fix" : "Program before the keyed fix";
        }
        else if (t === "parsons") { out.program = q.lines.join("\n"); out.programLabel = "Lines in the keyed order"; }
        else if (t === "coding") { const fn = (q.prompt.match(/^Write (\w+)\(/) || [])[1]; out.program = REF[fn] || null; out.programLabel = "Reference solution"; }
        else { out.program = q.type === "multiple_choice" ? choiceProgram() : null; out.picks = q.type === "multiple_choice" ? LET[q.answer] : (q.answer ? "True" : "False"); out.result = out.program ? v.output : null; }
        if (["code_completion", "debugging", "coding", "parsons", "output_prediction"].includes(t) && v.tests) out.tests = v.tests;
      }
      // One line of evidence, for the compact view in review.html.
      out.summary = out.failed || v.note ? v.note
        : v.level === "proven" ? (out.output != null ? `The solution program printed ${out.output}, which matches the key.`
          : out.picks ? (out.program ? `Running the program picks ${q.type === "true_false" ? out.picks : "option " + out.picks}, the keyed answer.` : q.type === "true_false" ? `The statement was run in the sandbox and came out ${out.picks}, as keyed.` : `Each option was run in the sandbox; only ${out.picks} behaves as the stem says.`)
          : `The keyed answer passed ${v.tests} of ${v.tests} tests in the sandbox.`)
        : v.solvers ? `Quoted word for word from ${v.quotes[0].section}; ${v.solvers.agree} of ${v.solvers.total} blind solvers chose the key.` : L.detail;
      out.wrong = q.type === "multiple_choice" ? q.options.map((o, i) => ({ letter: LET[i], text: o, why: v.misconceptions?.[i] || null })).filter((_, i) => i !== q.answer) : [];
      out.tagged = !!v.misconceptions;
      // The tool and version that checked the key; the trust label comes from the tool (MOCK.checkedBy).
      out.cb = MOCK.checkedBy(q);
      const TL = Object.values(MOCK.LEVELS).find((l) => l.label === out.cb.level) || L;
      out.tone = TL.tone;
      out.meaning = out.failed ? "The key check failed, so the question stopped before review."
        : v.level === "judged" && v.solvers ? "The quote was found, but the blind solvers split, so only the judge panel stands behind the key."
        : TL.detail;
      return out;
    }

    function page() {
      const c = Mock.course;
      const id = Number(Mock.param("id") || 1004);
      const q0 = MOCK.question(id);
      const q = q0 && q0.course === c.id ? q0 : null;
      const TEST_TYPES = ["code_completion", "debugging", "coding"];
      const now = () => "2026-09-30 " + new Date().toTimeString().slice(0, 5);
      if (q) document.title = `Question ${q.id} · Adaptive Trainer (mockup)`;
      return {
        course: c, id, q, mode: "view",
        kc: q ? keyCheck(q) : null,
        exam: q ? MOCK.heldFor(q.id) : null,
        fmt: (iso) => new Date(`${iso}T12:00:00`).toLocaleDateString("en-US", { month: "short", day: "numeric" }),
        status: q?.status, prompt: q?.prompt, answerText: q?.answer_text, edited: false,
        draft: { prompt: "", answer_text: "" },
        rej: { reasons: [], note: "" },
        rejectedWith: q?.rejection_reason ? MOCK.rejection_reasons.find((r) => r[0] === q.rejection_reason)[1] : null,
        history: q ? MOCK.question_history(q) : [],
        activeVersion: (c.taxonomy_versions.find((v) => v.active) || {}).label || "—",
        sourceHref: q ? Mock.link("section.html", QView.sourceParams(q) || {}) : "#",
        get flagCount() { return q ? Object.values(q.judges).filter((v) => v === "flag").length : 0; },
        dupes: q ? MOCK.duplicates(q).map((d) => ({ q: MOCK.question(d.question_id), score: d.score })) : [],
        checks: q ? Object.entries(q.checks).map(([name, result]) => ({ name, result, detail: MOCK.check_detail[name][result] })) : [],
        judges: q ? MOCK.judges.map((j) => ({ ...j, verdict: q.judges[j.id], note: MOCK.judge_note(q, j.id), codes: q.judges[j.id] === "flag" ? MOCK.judge_codes[j.id] : [] })) : [],
        reasons: MOCK.rejection_reasons.filter(([k]) =>
          (k !== "poor_distractors" || q?.type === "multiple_choice") &&
          (!["incorrect_tests", "poor_tests"].includes(k) || TEST_TYPES.includes(q?.type))),
        get draftChanged() { return this.draft.prompt !== this.prompt || (this.draft.answer_text || "") !== (this.answerText || ""); },
        log(what) { this.history.push({ at: now(), who: MOCK.me.name, what }); },
        startEdit() { this.draft = { prompt: this.prompt, answer_text: this.answerText || "" }; this.mode = "edit"; },
        startReject() {
          this.rej = { reasons: this.dupes.length ? ["too_similar_repetitive"] : [], note: "" };
          this.mode = "reject";
        },
        approve() { this.status = "approved"; this.rejectedWith = null; this.log("Approved"); Mock.toast(`Question ${q.id} approved`); },
        saveEdit() {
          const fields = [this.draft.prompt !== this.prompt && "prompt", (this.draft.answer_text || "") !== (this.answerText || "") && "answer"].filter(Boolean);
          this.prompt = this.draft.prompt; this.answerText = this.draft.answer_text || null;
          this.edited = true; this.status = "approved"; this.mode = "view"; this.rejectedWith = null;
          this.log(`Edited (${fields.join(", ")}) and approved`);
          Mock.toast(`Question ${q.id} edited and approved`);
        },
        reject() {
          const labels = this.rej.reasons.map((k) => MOCK.rejection_reasons.find((r) => r[0] === k)[1]);
          this.status = "rejected"; this.rejectedWith = labels.join(", "); this.mode = "view";
          this.log(`Rejected: ${labels.join(", ")}${this.rej.note ? ` — “${this.rej.note}”` : ""}`);
          Mock.toast(`Question ${q.id} rejected`);
        },
      };
    }
  </script>
</body>
</html>
